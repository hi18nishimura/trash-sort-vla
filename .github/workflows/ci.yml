# CI: the ROS-free TAMP core (planning + geometry + NL + MCP), which is the part
# that can run anywhere. The ROS 2 / Gazebo layer needs Jazzy + Gazebo Harmonic +
# GPU-less physics and is exercised by `scripts/reliability_pnp.sh` on a real
# machine instead — CI making claims about it would be exactly the kind of
# overstatement this project's audit removed.
name: core-tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core + MCP extra (no ROS, no perception extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"
      - name: Unit tests (ROS-free core)
        run: python -m pytest tests/unit -q
      - name: Integration tests (closed loop, offline)
        run: python -m pytest tests/integration -q
