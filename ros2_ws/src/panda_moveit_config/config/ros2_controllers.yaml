# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    panda_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    panda_hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster


panda_arm_controller:
  ros__parameters:
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7

panda_hand_controller:
  ros__parameters:
    command_interfaces:
      - position
    state_interfaces:
      - position
    # Both fingers are commanded explicitly (mirrored) because DART cannot honor the
    # URDF mimic that used to couple joint2 to joint1. moveit_executor sends the same
    # target for both, giving a real symmetric two-finger close.
    joints:
      - panda_finger_joint1
      - panda_finger_joint2
    # MUST be false: when true the fingers keep their terminal velocity after a
    # trajectory ends, so after an open they coast PAST the 0.038 target up to the
    # 0.04 joint limit and pin there — after which every later command (open OR close)
    # is silently ignored while the controller still reports success. That is why the
    # 1st grasp worked but the 2nd never closed. false makes the fingers stop AT the
    # commanded position.
    allow_nonzero_velocity_at_trajectory_end: false
